server:
  port: 3000
  environment: development

database:
  host: localhost
  port: 5432
  name: tourism_marketplace
  user: postgres
  password: postgres
  poolSize: 20

redis:
  host: localhost
  port: 6379
  password: ""

llm:
  provider: openai
  apiKey: your_openai_api_key
  model: gpt-4
  maxTokens: 2000

vectorDb:
  provider: pinecone
  apiKey: your_pinecone_api_key
  environment: us-west1-gcp
  index: tourism-experiences

payment:
  provider: stripe
  apiKey: your_stripe_secret_key
  webhookSecret: your_stripe_webhook_secret

jwt:
  secret: your_jwt_secret_key_at_least_32_characters_long
  expiresIn: 3600
  refreshSecret: your_jwt_refresh_secret_key_at_least_32_characters
  refreshExpiresIn: 2592000

oauth:
  google:
    clientId: your_google_client_id
    clientSecret: your_google_client_secret
  facebook:
    appId: your_facebook_app_id
    appSecret: your_facebook_app_secret

email:
  provider: sendgrid
  apiKey: your_sendgrid_api_key
  from: noreply@tourismmarketplace.com

storage:
  provider: s3
  bucket: tourism-marketplace-images
  region: us-east-1
  accessKeyId: your_aws_access_key
  secretAccessKey: your_aws_secret_key

maps:
  apiKey: your_google_maps_api_key

exchangeRate:
  apiKey: your_exchange_rate_api_key

frontend:
  webUrl: http://localhost:3001
  mobileDeepLinkScheme: tourismmarketplace
